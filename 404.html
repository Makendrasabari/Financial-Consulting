<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Reset and Layout */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-navy, #050B14);
      color: var(--text-light-primary, #FFFFFF);
      font-family: var(--font-primary, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Elements */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-glow, rgba(223, 177, 91, 0.15)) 0%, rgba(5, 11, 20, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Background Financial Particles */
    .floating-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .ambient-symbol {
      position: absolute;
      font-size: 20px;
      color: var(--primary-gold, #DFB15B);
      opacity: 0.2;
      font-weight: 700;
      user-select: none;
    }

    /* Error Card Container */
    .error-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 48px;
      max-width: 640px;
      width: 90%;
      background: var(--card-glass, rgba(13, 27, 54, 0.45));
      border: 1px solid var(--border-glass, rgba(255, 255, 255, 0.08));
      border-radius: var(--border-radius-lg, 24px);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* 404 Display Row */
    .display-404 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      user-select: none;
    }

    .num-4 {
      font-size: clamp(90px, 16vw, 160px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      color: var(--text-light-primary, #FFFFFF);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background: linear-gradient(180deg, #FFFFFF 0%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Interactive Middle 0 Wrapper */
    .zero-wrapper {
      width: clamp(90px, 16vw, 160px);
      height: clamp(90px, 16vw, 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .rotating-zero {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    /* Text Formatting */
    .error-message {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      color: var(--text-light-primary, #FFFFFF);
      line-height: 1.35;
      margin-bottom: 40px;
      max-width: 520px;
      letter-spacing: -0.5px;
    }

    /* Action Buttons Row */
    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn-404-primary {
      background: var(--gold-gradient, linear-gradient(135deg, #E6B860 0%, #C59B48 100%));
      color: #03070E;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: var(--border-radius-sm, 8px);
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px var(--gold-glow, rgba(223, 177, 91, 0.35));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .btn-404-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(223, 177, 91, 0.5);
      color: #000000;
    }

    .btn-404-secondary {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-light-primary, #FFFFFF);
      font-weight: 600;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: var(--border-radius-sm, 8px);
      text-decoration: none;
      border: 1px solid var(--border-glass-hover, rgba(255, 255, 255, 0.18));
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .btn-404-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary-gold, #DFB15B);
      color: var(--primary-gold, #DFB15B);
      transform: translateY(-2px);
    }

    /* Media Queries */
    @media (max-width: 480px) {
      .error-card {
        padding: 40px 24px;
      }
      .display-404 {
        gap: 6px;
      }
      .error-actions {
        flex-direction: column;
        width: 100%;
      }
      .btn-404-primary, .btn-404-secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow & Grid -->
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <!-- Ambient Floating Currency Particles -->
  <div class="floating-particles">
    <span class="ambient-symbol" style="top: 15%; left: 18%;"> $ </span>
    <span class="ambient-symbol" style="top: 25%; right: 20%;"> € </span>
    <span class="ambient-symbol" style="bottom: 22%; left: 15%;"> £ </span>
    <span class="ambient-symbol" style="bottom: 18%; right: 18%;"> ¥ </span>
  </div>

  <!-- 404 Error Main Container -->
  <main class="error-card">

    <!-- 404 Visual Focus -->
    <div class="display-404">
      <span class="num-4">4</span>

      <div class="zero-wrapper">
        <svg class="rotating-zero" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#E6B860" />
              <stop offset="100%" stop-color="#C59B48" />
            </linearGradient>
            <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE" />
              <stop offset="100%" stop-color="#00C6FF" />
            </linearGradient>
            <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Outer Segmented Financial Dial Ring -->
          <circle cx="80" cy="80" r="72" stroke="url(#goldGradient)" stroke-width="3" fill="none" stroke-dasharray="12 6" opacity="0.75" />

          <!-- Inner Smooth Guide Ring -->
          <circle cx="80" cy="80" r="58" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none" />

          <!-- Currency Nodes along the Cycle -->
          <!-- Dollar Node ($) at Top (0 deg) -->
          <g transform="translate(80, 22)">
            <circle cx="0" cy="0" r="11" fill="url(#goldGradient)" filter="url(#glowEffect)" />
            <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#03070E">$</text>
          </g>

          <!-- Euro Node (€) at Right (90 deg) -->
          <g transform="translate(138, 80)">
            <circle cx="0" cy="0" r="11" fill="url(#goldGradient)" filter="url(#glowEffect)" />
            <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#03070E">€</text>
          </g>

          <!-- Pound Node (£) at Bottom (180 deg) -->
          <g transform="translate(80, 138)">
            <circle cx="0" cy="0" r="11" fill="url(#goldGradient)" filter="url(#glowEffect)" />
            <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#03070E">£</text>
          </g>

          <!-- Yen Node (¥) at Left (270 deg) -->
          <g transform="translate(22, 80)">
            <circle cx="0" cy="0" r="11" fill="url(#goldGradient)" filter="url(#glowEffect)" />
            <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#03070E">¥</text>
          </g>

          <!-- Central Financial Compass Node -->
          <circle cx="80" cy="80" r="26" fill="#050B14" stroke="url(#goldGradient)" stroke-width="2" />
          <path d="M72 80 L88 80 M80 72 L80 88" stroke="#DFB15B" stroke-width="2" stroke-linecap="round" />
          <circle cx="80" cy="80" r="3" fill="#00F2FE" />
        </svg>
      </div>

      <span class="num-4">4</span>
    </div>

    <!-- Required Text -->
    <h1 class="error-message">Looks like this financial path has taken a wrong turn.</h1>

    <!-- Two Required Action Buttons -->
    <div class="error-actions">
      <a href="index.html" class="btn-404-primary">Back to Home</a>
      <button type="button" onclick="window.history.back()" class="btn-404-secondary">Go Back</button>
    </div>

  </main>

  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Entrance Animations
      gsap.from('.error-card', {
        opacity: 0,
        y: 25,
        scale: 0.96,
        duration: 1.1,
        ease: 'power3.out'
      });

      gsap.from('.num-4', {
        opacity: 0,
        scale: 0.8,
        stagger: 0.15,
        duration: 0.9,
        delay: 0.2,
        ease: 'back.out(1.6)'
      });

      gsap.from('.zero-wrapper', {
        opacity: 0,
        scale: 0.6,
        duration: 1,
        delay: 0.3,
        ease: 'back.out(1.4)'
      });

      gsap.from('.error-message', {
        opacity: 0,
        y: 15,
        duration: 0.8,
        delay: 0.6,
        ease: 'power2.out'
      });

      gsap.from('.error-actions', {
        opacity: 0,
        y: 15,
        duration: 0.8,
        delay: 0.8,
        ease: 'power2.out'
      });

      // 2. Smooth Infinite Rotation of the Currency Cycle Middle 0
      gsap.to('.rotating-zero', {
        rotation: 360,
        duration: 25,
        repeat: -1,
        ease: 'none',
        transformOrigin: '50% 50%'
      });

      // 3. Subtle Floating Motion for Ambient Background Symbols
      gsap.to('.ambient-symbol', {
        y: -10,
        duration: 2.8,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut',
        stagger: 0.35
      });
    });
  </script>
</body>
</html>
